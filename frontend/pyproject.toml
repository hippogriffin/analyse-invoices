[project]
name = "invoice-upload"
version = "0.1.0"
description = "Browser camera capture UI that hands photos to the invoice analysis backend"
requires-python = ">=3.11"
# No Azure SDK here on purpose: this service serves pages only. Storage and
# Document Intelligence are the backend's job, so no credentials live here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
invoice-upload = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
