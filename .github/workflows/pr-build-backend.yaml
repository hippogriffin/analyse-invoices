name: Build backend docker image on PR

on:
  workflow_dispatch:
  pull_request: 

jobs:
  build-and-push-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Compare VERSION to main
        id: compare_version
        env:
          REPO: ${{ github.repository }}
          MAIN_REF: main
          APP: backend
        run: |
          set -euo pipefail

          # read current version from workspace
          if [ ! -f ./${APP}/VERSION ]; then
            echo "ERROR: VERSION file not found in workspace"
            exit 1
          fi

          current=$(tr -d '[:space:]' < ./${APP}/VERSION)
          echo "Current VERSION: $current"

          # fetch VERSION from the default branch via raw.githubusercontent
          raw_url="https://raw.githubusercontent.com/${REPO}/${MAIN_REF}/${APP}/VERSION"
          
          echo "Fetching ${raw_url}"
          main_version=$(curl -fsSL "${raw_url}" || true)

          if [ -z "${main_version:-}" ]; then
            echo "ERROR: failed to retrieve VERSION from ${MAIN_REF} at ${raw_url}"
            exit 1
          fi

          main_version=$(echo "${main_version}" | tr -d '[:space:]')
          echo "Main (${MAIN_REF}) VERSION: $main_version"

          if [ "$current" = "$main_version" ]; then
            echo "ERROR: VERSION ($current) is identical to ${MAIN_REF} ($main_version). Failing build."
            exit 1
          fi

          echo "VERSION differs from ${MAIN_REF} — OK"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        id: push_backend
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: false
          context: ./backend
          load: true
          tags: analyse-invoices-backend:${{ github.sha }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: analyse-invoices-backend:${{ github.sha }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
