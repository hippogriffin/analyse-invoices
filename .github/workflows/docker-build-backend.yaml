name: Publish backend docker image

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 3 * * 1'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - .github/**

jobs:
  build-and-push-image:
    name: Push Docker image github
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Read version
        id: get_version
        env:
          APP: backend
        run: |
          echo "version=$(cat ${APP}/VERSION)" >> $GITHUB_OUTPUT

      - name: Add timestamp
        id: timestamp
        run: |
          ts=$(date +%s)
          echo "::set-output name=BUILD_ID::${ts}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/hippogriffin/analyse-invoices-backend
          tags: |
            type=raw,value=${{ steps.get_version.outputs.version }}-${{ steps.timestamp.outputs.BUILD_ID }}
          flavor: |
            latest=true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        id: push_backend
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          context: ./backend
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore