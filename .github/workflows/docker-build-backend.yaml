name: Publish backend docker image

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  build-and-push-image:
    name: Push Docker image github
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build ID
        id: prep
        run: |
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "::set-output name=BUILD_ID::${sha}-${ts}"

      - name: Build and push Docker images
        id: push_backend
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/hippogriffin/analyse-invoices-backend:${{ steps.prep.outputs.BUILD_ID }}
          context: ./backend
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/hippogriffin/analyse-invoices-backend:${{ steps.prep.outputs.BUILD_ID }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'